<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Application Automation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
        }

        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 40px;
            font-size: 1.1em;
        }

        .upload-section {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            border: 2px dashed #667eea;
        }

        .upload-section h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.5em;
        }

        .file-input-wrapper {
            position: relative;
            margin-bottom: 20px;
        }

        .file-input-label {
            display: block;
            padding: 15px 30px;
            background: #667eea;
            color: white;
            border-radius: 10px;
            cursor: pointer;
            text-align: center;
            transition: all 0.3s;
            font-weight: 600;
        }

        .file-input-label:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        input[type="file"] {
            display: none;
        }

        .file-name {
            margin-top: 10px;
            color: #666;
            font-size: 0.9em;
            text-align: center;
        }

        .checkbox-wrapper {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
            padding: 15px;
            background: white;
            border-radius: 10px;
        }

        .checkbox-wrapper input[type="checkbox"] {
            width: 20px;
            height: 20px;
            margin-right: 10px;
            cursor: pointer;
        }

        .checkbox-wrapper label {
            cursor: pointer;
            color: #333;
            font-weight: 500;
        }

        .btn {
            width: 100%;
            padding: 15px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: #6c757d;
            margin-top: 15px;
        }

        .btn-secondary:hover:not(:disabled) {
            background: #5a6268;
        }

        .status {
            margin-top: 30px;
            padding: 20px;
            border-radius: 10px;
            display: none;
        }

        .status.success {
            background: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
        }

        .status.error {
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
        }

        .status.loading {
            background: #d1ecf1;
            border: 1px solid #bee5eb;
            color: #0c5460;
        }

        .loader {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .result-details {
            margin-top: 15px;
            padding: 15px;
            background: white;
            border-radius: 8px;
            font-size: 0.95em;
        }

        .result-details h3 {
            color: #667eea;
            margin-bottom: 10px;
        }

        .result-details p {
            margin: 5px 0;
            color: #555;
        }

        .result-details a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }

        .result-details a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📋 Job Application Automation</h1>
        <p class="subtitle">Upload a job posting screenshot and let AI do the rest!</p>

        <!-- Upload Base Resume Section -->
        <div class="upload-section">
            <h2>1. Upload Your Base Resume (Optional)</h2>
            <div class="file-input-wrapper">
                <label for="base-resume" class="file-input-label">
                    📄 Choose Base Resume (PDF)
                </label>
                <input type="file" id="base-resume" accept=".pdf">
                <div class="file-name" id="base-resume-name">No file chosen</div>
            </div>
            <button class="btn btn-secondary" onclick="uploadBaseResume()">Save Base Resume</button>
        </div>

        <!-- Process Job Posting Section -->
        <div class="upload-section">
            <h2>2. Process Job Posting</h2>
            <div class="file-input-wrapper">
                <label for="job-screenshot" class="file-input-label">
                    📸 Choose Job Posting Screenshot
                </label>
                <input type="file" id="job-screenshot" accept="image/*" required>
                <div class="file-name" id="screenshot-name">No file chosen</div>
            </div>

            <div class="checkbox-wrapper">
                <input type="checkbox" id="auto-transform" checked>
                <label for="auto-transform">Automatically transform resume for this job</label>
            </div>

            <div class="checkbox-wrapper">
                <input type="checkbox" id="use-uploaded-resume">
                <label for="use-uploaded-resume">Use uploaded resume for this job (instead of base resume)</label>
            </div>

            <div class="file-input-wrapper" id="custom-resume-wrapper" style="display: none;">
                <label for="custom-resume" class="file-input-label">
                    📄 Choose Custom Resume for This Job
                </label>
                <input type="file" id="custom-resume" accept=".pdf">
                <div class="file-name" id="custom-resume-name">No file chosen</div>
            </div>

            <button class="btn" onclick="processJobPosting()" id="process-btn">
                🚀 Process Job Posting
            </button>
        </div>

        <button class="btn btn-secondary" onclick="downloadExcel()">
            📥 Download Excel Sheet (Local Backup)
        </button>

        <button class="btn btn-secondary" onclick="openGoogleSheets()" id="sheets-btn" style="display: none;">
            📊 Open Google Sheets
        </button>

        <div class="status" id="status"></div>
    </div>

    <script>
        // File input handlers
        document.getElementById('base-resume').addEventListener('change', function(e) {
            const fileName = e.target.files[0] ? e.target.files[0].name : 'No file chosen';
            document.getElementById('base-resume-name').textContent = fileName;
        });

        document.getElementById('job-screenshot').addEventListener('change', function(e) {
            const fileName = e.target.files[0] ? e.target.files[0].name : 'No file chosen';
            document.getElementById('screenshot-name').textContent = fileName;
        });

        document.getElementById('custom-resume').addEventListener('change', function(e) {
            const fileName = e.target.files[0] ? e.target.files[0].name : 'No file chosen';
            document.getElementById('custom-resume-name').textContent = fileName;
        });

        document.getElementById('use-uploaded-resume').addEventListener('change', function(e) {
            const wrapper = document.getElementById('custom-resume-wrapper');
            wrapper.style.display = e.target.checked ? 'block' : 'none';
        });

        async function uploadBaseResume() {
            const fileInput = document.getElementById('base-resume');
            const file = fileInput.files[0];

            if (!file) {
                showStatus('Please select a PDF file', 'error');
                return;
            }

            showStatus('Uploading base resume...', 'loading');

            const formData = new FormData();
            formData.append('resume', file);

            try {
                const response = await fetch('/upload-base-resume/', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (response.ok) {
                    showStatus('✅ Base resume uploaded successfully!', 'success');
                } else {
                    showStatus('❌ Error: ' + data.detail, 'error');
                }
            } catch (error) {
                showStatus('❌ Error uploading resume: ' + error.message, 'error');
            }
        }

        async function processJobPosting() {
            const screenshotInput = document.getElementById('job-screenshot');
            const screenshot = screenshotInput.files[0];

            if (!screenshot) {
                showStatus('Please select a job posting screenshot', 'error');
                return;
            }

            const autoTransform = document.getElementById('auto-transform').checked;
            const useUploadedResume = document.getElementById('use-uploaded-resume').checked;
            const customResumeInput = document.getElementById('custom-resume');
            const customResume = useUploadedResume ? customResumeInput.files[0] : null;

            showStatus('Processing job posting... This may take a minute.', 'loading');
            document.getElementById('process-btn').disabled = true;

            const formData = new FormData();
            formData.append('screenshot', screenshot);
            formData.append('auto_transform_resume', autoTransform);

            if (customResume) {
                formData.append('base_resume', customResume);
            }

            try {
                const response = await fetch('/process-job-posting/', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (response.ok) {
                    // Store Google Sheets URL if available
                    if (data.google_sheets_url) {
                        googleSheetsUrl = data.google_sheets_url;
                        document.getElementById('sheets-btn').style.display = 'block';
                    }

                    let message = '✅ Job posting processed successfully!';
                    let details = `
                        <div class="result-details">
                            <h3>Job Details:</h3>
                            <p><strong>Company:</strong> ${data.job_data.company}</p>
                            <p><strong>Title:</strong> ${data.job_data.job_title}</p>
                            <p><strong>Role Type:</strong> ${data.job_data.role_type}</p>
                            <p><strong>Compensation:</strong> ${data.job_data.compensation}</p>
                            <p><strong>Application:</strong> ${data.job_data.application_method}</p>
                            ${data.resume_info && !data.resume_info.error ?
                                `<p><strong>Resume:</strong> <a href="${data.resume_info.download_link}" target="_blank">Download Tailored Resume</a></p>` :
                                ''}
                            ${data.resume_info && data.resume_info.error ?
                                `<p style="color: #dc3545;"><strong>Resume Error:</strong> ${data.resume_info.error}</p>` :
                                ''}
                            <p><strong>Excel Row:</strong> ${data.excel_row}</p>
                            ${data.google_sheets_url ?
                                `<p><strong>📊 Google Sheets:</strong> <a href="${data.google_sheets_url}" target="_blank">Open in Google Sheets</a> (Row ${data.sheets_row})</p>` :
                                ''}
                        </div>
                    `;
                    showStatus(message + details, 'success');
                } else {
                    showStatus('❌ Error: ' + data.detail, 'error');
                }
            } catch (error) {
                showStatus('❌ Error processing job posting: ' + error.message, 'error');
            } finally {
                document.getElementById('process-btn').disabled = false;
            }
        }

        async function downloadExcel() {
            window.location.href = '/download-excel/';
        }

        let googleSheetsUrl = null;

        async function openGoogleSheets() {
            if (googleSheetsUrl) {
                window.open(googleSheetsUrl, '_blank');
            }
        }

        function showStatus(message, type) {
            const statusDiv = document.getElementById('status');
            statusDiv.className = 'status ' + type;

            if (type === 'loading') {
                statusDiv.innerHTML = '<div class="loader"></div>' + message;
            } else {
                statusDiv.innerHTML = message;
            }

            statusDiv.style.display = 'block';

            if (type === 'success' || type === 'error') {
                setTimeout(() => {
                    if (type !== 'success') {
                        statusDiv.style.display = 'none';
                    }
                }, 5000);
            }
        }
    </script>
</body>
</html>
